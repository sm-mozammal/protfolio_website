<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Portfolio Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
      :root {
        --primary: #3b82f6;
        --secondary: #2563eb;
        --success: #10b981;
        --danger: #ef4444;
        --light-bg: #f8fafc;
        --light-card: #ffffff;
        --light-sidebar: #f1f5f9;
        --text-dark: #1e293b;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --radius: 12px;
      }
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        scroll-behavior: smooth;
      }
      
      body {
        background: linear-gradient(135deg, var(--light-bg) 0%, #f1f5f9 100%);
        color: var(--text-dark);
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }
      
      /* Animated background */
      body::before {
        content: '';
        position: fixed;
        top: -50%;
        right: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        animation: moveBackground 20s linear infinite;
        pointer-events: none;
        z-index: -1;
      }
      
      @keyframes moveBackground {
        0% {
          transform: translate(0, 0);
        }
        100% {
          transform: translate(50px, 50px);
        }
      }
      
      /* Orbs */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.15;
        pointer-events: none;
        z-index: -2;
      }
      
      .orb-1 {
        width: 400px;
        height: 400px;
        background: var(--primary);
        top: -200px;
        right: -200px;
        animation: float 15s ease-in-out infinite;
      }
      
      .orb-2 {
        width: 300px;
        height: 300px;
        background: #60a5fa;
        bottom: -150px;
        left: -150px;
        animation: float 12s ease-in-out infinite reverse;
      }
      
      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(30px, -30px);
        }
      }
      
      .login-container {
        width: 100%;
        max-width: 420px;
        position: relative;
        z-index: 10;
      }
      
      .login-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 50px 40px;
        box-shadow: 0 20px 60px rgba(59, 130, 246, 0.1);
        animation: slideIn 0.6s ease-out;
      }
      
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      
      .logo-section {
        text-align: center;
        margin-bottom: 40px;
      }
      
      .logo {
        font-size: 3.5rem;
        margin-bottom: 15px;
        animation: pulse 2s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      
      .logo-text {
        font-size: 1.6rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .logo-subtitle {
        font-size: 0.9rem;
        color: var(--text-muted);
        margin-top: 10px;
      }
      
      .form-group {
        margin-bottom: 24px;
      }
      
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text-dark);
        letter-spacing: 0.02em;
      }
      
      .input-wrapper {
        position: relative;
      }
      
      .form-group input {
        width: 100%;
        padding: 14px 16px;
        padding-left: 44px;
        background: #f9fafb;
        border: 1.5px solid var(--border-color);
        border-radius: 10px;
        color: var(--text-dark);
        font-family: inherit;
        font-size: 1rem;
        transition: all 0.3s ease;
      }
      
      .form-group input::placeholder {
        color: var(--text-muted);
      }
      
      .form-group input:focus {
        outline: none;
        border-color: var(--primary);
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }
      
      .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 1rem;
        transition: color 0.3s;
      }
      
      .form-group input:focus ~ .input-icon,
      .form-group input:not(:placeholder-shown) ~ .input-icon {
        color: var(--primary);
      }
      
      .login-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        transition: all 0.3s;
        letter-spacing: 0.02em;
        position: relative;
        overflow: hidden;
        margin-top: 8px;
      }
      
      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(59, 130, 246, 0.3);
      }
      
      .login-btn:active {
        transform: translateY(0);
      }
      
      .login-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.2);
        transition: left 0.3s;
      }
      
      .login-btn:hover::before {
        left: 100%;
      }
      
      .error-alert {
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 24px;
        color: #dc2626;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 10px;
        animation: shake 0.5s ease;
      }
      
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-10px);
        }
        75% {
          transform: translateX(10px);
        }
      }
      
      .error-alert i {
        flex-shrink: 0;
        font-size: 1.1rem;
      }
      
      .forgot-password {
        text-align: right;
        margin-bottom: 20px;
      }
      
      .forgot-password a {
        font-size: 0.85rem;
        color: var(--text-muted);
        text-decoration: none;
        transition: color 0.3s;
      }
      
      .forgot-password a:hover {
        color: var(--primary);
      }
      
      .separator {
        text-align: center;
        margin: 24px 0;
        position: relative;
        color: var(--text-muted);
        font-size: 0.85rem;
      }
      
      .separator::before,
      .separator::after {
        content: '';
        position: absolute;
        top: 50%;
        width: calc(50% - 30px);
        height: 1px;
        background: var(--border-color);
      }
      
      .separator::before {
        left: 0;
      }
      
      .separator::after {
        right: 0;
      }
      
      .signup-link {
        text-align: center;
        margin-top: 24px;
        font-size: 0.9rem;
        color: var(--text-muted);
      }
      
      .signup-link a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.3s;
      }
      
      .signup-link a:hover {
        text-decoration: underline;
      }
      
      .back-link {
        text-align: center;
        margin-top: 24px;
      }
      
      .back-link a {
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.3s;
      }
      
      .back-link a:hover {
        color: var(--primary);
        gap: 10px;
      }
      
      .back-link i {
        font-size: 0.8rem;
      }
      
      .csrf-token {
        display: none;
      }
      
      @media (max-width: 480px) {
        .login-card {
          padding: 35px 25px;
        }
      
        .logo {
          font-size: 2.5rem;
        }
      
        .logo-text {
          font-size: 1.3rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-container">
      <div class="login-card">
        <div class="logo-section">
          <div class="logo">📊</div>
          <div class="logo-text">
            Portf<span style="color: var(--accent);">o</span>lio
          </div>
          <p class="logo-subtitle">Admin Dashboard</p>
        </div>

        {% if error %}
          <div class="error-alert">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ error }}</span>
          </div>
        {% endif %}

        <form method="POST" class="login-form">
          {% csrf_token %}

          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus />
              <i class="fas fa-user input-icon"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="password" name="password" placeholder="Enter your password" required />
              <i class="fas fa-lock input-icon"></i>
            </div>
          </div>

          <div class="forgot-password">
            <a href="#forgot">Forgot password?</a>
          </div>

          <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        </form>

        <div class="back-link">
          <a href="{% url 'portfolio-home' %}"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
        </div>
      </div>
    </div>

    <script>
      // Add loading state to button
      const form = document.querySelector('.login-form')
      const submitBtn = form.querySelector('.login-btn')
      
      form.addEventListener('submit', function () {
        submitBtn.disabled = true
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...'
      })
      
      // Focus effects
      document.querySelectorAll('input').forEach((input) => {
        input.addEventListener('focus', function () {
          this.parentElement.style.transform = 'scale(1.02)'
        })
      
        input.addEventListener('blur', function () {
          this.parentElement.style.transform = 'scale(1)'
        })
      })
    </script>
  </body>
</html>
